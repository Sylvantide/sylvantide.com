pid /run/nginx-sylvantide.pid;
error_log /var/log/nginx/sylvantide-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 127.0.0.1:8445 ssl;
        server_name sylvantide.com sylvantide.net sylvantide.org;

        ssl_certificate     /etc/letsencrypt/live/sylvantide.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sylvantide.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000" always;

        root /var/www/sylvantide;
        index index.html;

        location /demo/ {
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /demo/index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
